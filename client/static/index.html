<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so a home-screen launch can paint under the notch; the safe-area
         insets in App.module.css keep the content out of it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- iOS ignores the manifest for Add to Home Screen: these three meta tags are what
         make it launch without Safari chrome, and what names the icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sweden" />
    <meta name="theme-color" content="#005293" />

    <link rel="stylesheet" href="/out.css" />
    <title>Sweden</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/out.js"></script>
  </body>
</html>
